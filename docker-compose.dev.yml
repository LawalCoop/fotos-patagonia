services:
  # Servicio del Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
    command: bash -c "sleep 5 && python /app/initial_data.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - fotopatagonia_network

  # Servicio de la Base de Datos (PostgreSQL)
  db:
    image: postgres:13
    ports:
      - "5433:5432"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fotopatagonia_network

  # Servicio de Localstack (S3)
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566" # Puerto principal de LocalStack
      - "4510-4559:4510-4559" # Puertos para servicios individuales
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=1
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - fotopatagonia_network

  # Servicio del Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      # Mantener dependencias dentro de Docker (evita conflicto con node_modules del host)
      - frontend_node_modules:/app/node_modules
      # Mantener .next dentro de Docker (evita corrupción por bind-mount / permisos del host)
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
      # Hot reload estable en Docker (especialmente Linux/WSL/volúmenes)
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - NEXT_TELEMETRY_DISABLED=1
    # Limpia artefactos viejos dentro del volumen de .next antes de arrancar Next dev
    # (evita estados parciales que terminan en missing middleware-manifest.json / errores de runtime)
    command: sh -lc "rm -rf /app/.next/* /app/.next/.[!.]* /app/.next/..?* 2>/dev/null || true; npm run dev -- -H 0.0.0.0 -p 3000"
    depends_on:
      - backend
    networks:
      - fotopatagonia_network

  # mailhog:
  #   image: mailhog/mailhog
  #   ports:
  #     - "1025:1025" # SMTP
  #     - "8025:8025" # Web UI
  #   networks:
  #     - fotopatagonia_network

# Definición de volúmenes y redes
volumes:
  postgres_data:
  localstack_data:
  frontend_node_modules:
  frontend_next:

networks:
  fotopatagonia_network:
    driver: bridge
