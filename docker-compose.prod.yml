version: "3.8"

# Rotación de logs común a todos los servicios: json-file, hasta 5 archivos de
# 10MB por contenedor. Evita que los logs llenen el disco y conserva historial
# reciente para el panel (Dozzle).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    # Baja la imagen ya construida del registry (no compila acá).
    # TAG permite fijar una versión (ej: TAG=0.1.0) para rollback; por defecto, latest.
    image: ghcr.io/lawalcoop/fotopatagonia-backend:${TAG:-latest}
    container_name: fotopatagonia-backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *default-logging

    # Migrations + app (fail fast)
    command: >
      sh -c "
      alembic upgrade head &&
      exec uvicorn main:app --host 0.0.0.0 --port 8000
      "

    # Sin puertos publicados: el backend se alcanza solo por la red interna.
    # Quien lo expone al mundo (vía /api) es Caddy.
    depends_on:
      db:
        condition: service_healthy

    networks:
      - fotopatagonia_network

    # 🔐 HARDENING
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  db:
    image: postgres:13
    container_name: fotopatagonia-db
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - fotopatagonia_network

  frontend:
    # Baja la imagen ya construida del registry. Las NEXT_PUBLIC_* ya vienen
    # "quemadas" adentro de la imagen (se pasaron al buildear en GitHub).
    image: ghcr.io/lawalcoop/fotopatagonia-frontend:${TAG:-latest}
    container_name: fotopatagonia-frontend
    restart: unless-stopped
    logging: *default-logging

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

    environment:
      - NEXT_PUBLIC_API_URL=https://somosfotospatagonia.com/api
      - INTERNAL_API_URL=http://backend:8000

    # Sin puertos publicados: lo expone Caddy.
    networks:
      - fotopatagonia_network

  # Caddy: única puerta al exterior (80/443). HTTPS automático + ruteo.
  caddy:
    image: caddy:2-alpine
    container_name: fotopatagonia-caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fotopatagonia_network

  # Panel web de logs (solo lectura de la salida de los contenedores).
  # No publica puertos: se accede vía Caddy en /panel-logs con usuario/contraseña.
  dozzle:
    image: amir20/dozzle:latest
    container_name: fotopatagonia-dozzle
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOZZLE_BASE=/panel-logs
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      # Solo lectura del socket de Docker para leer los logs de los contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fotopatagonia_network

networks:
  fotopatagonia_network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
